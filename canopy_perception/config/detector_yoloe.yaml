      - plate
      - bowl
      - mug
      - drinking glass
      - bottle
      - jar
      - soda can
      - cutting board
      - knife
      - fork
      - spoon
      - dish rack
      - paper towel
      # bathroom
      - toilet
      - bathtub
      - shower
      - toilet paper
      - toothbrush
      - soap dispenser
      - hair dryer
      # laundry and cleaning
      - washing machine
      - clothes dryer
      - ironing board
      - vacuum cleaner
      - broom
      - mop
      - bucket
      - trash can
      # heating and air
      - fan
      - air conditioner
      - air purifier
      - space heater
      # electronics
      - television
      - monitor
      - laptop
      - desktop computer
      - keyboard
      - computer mouse
      - speaker
