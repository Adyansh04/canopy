# The detector for semantic mapping, against servers/semantic_server.py, whose SAM 3.1 backend
# conditions the image on each phrase in turn: about 40 ms a phrase after 0.45 s for the frame on
# a laptop RTX 4080. Keyed /** so a detector per camera, whatever its node name, reads it.
# config/detector_yoloe.yaml goes over it for YOLOE-26 (--detector yoloe).
#
# One name per kind of whole object, singular, lower case, 1-3 words: SAM 3.1 finds every instance
# of a word, so a part's name ("shelf") gets the parts. Two names for one object, as bookshelf and
# shelving unit, cost only time: the server keeps the better one. What an object is exactly is the
# describer's job; the world model maps people's other words onto these through its room table's
# synonyms.
/**:
  ros__parameters:
    # The server runs on the host, since it needs torch and CUDA.
    server_address: "tcp://127.0.0.1:5561"

    # Well past the slowest inference: this is what a stalled server costs before the node
    # rebuilds its socket.
    zmq_timeout_ms: 20000

    # How soon after an answer the next question is asked; the call itself blocks.
    detect_rate_hz: 1.0

    # The world model's frames from a still base, the only ones it uses masks from: at 1.6 s a
    # frame, none to spare on the others.
    still_frames: true

    # Frames older than this are not asked about. A still frame can wait for the other camera's
    # turn: the world model's frame_history_s covers this and the 1.6 s.
    max_image_age_s: 8.0

    # SAM 3.1's score is its match times the word's presence in the frame. On 202 renders of a
    # six-room flat this list scored F1 0.68 at 0.6 (YOLOE 0.56 at best on it): 0.7 scores 0.70 but
    # loses furniture, and the map's two-sightings rule already drops a stray detection.
    box_threshold: 0.6

    # An image embedding per instance, for the world model's matching and text search.
    embed: true

    phrases:
      - chair
      - armchair
      - sofa
      - dining table
      - coffee table
      - desk
      - nightstand
      - cabinet
      - wardrobe
      - bookshelf
      - shelving unit
      - bed
      - clock
      - potted plant
      - refrigerator
      - stove
      - microwave
      - kitchen counter
      - kettle
      - bowl
      - mug
      - tray
      - television
      - laptop
      - book
      - cardboard box
      - crate
      - trash can
      - lamp
      - bottle
      # A bathroom's own: without them the room table cannot type one. On the flat, which has
      # none, they added one stray in 202 frames, and 0.16 s a frame.
      - toilet
      - sink
      - bathtub
      - shower
